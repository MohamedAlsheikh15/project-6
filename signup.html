<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply-2</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <ul>
            <li><a href="index.html">Home</a></li>
        </ul>
        <ul>
            <li><a href="login.html" id="login-link">Login</a></li>
            <li><a href="signup.html" id="signup-link">Sign Up</a></li>
            <li><a href="#" id="user-link"></a></li>
        </ul>
        <ul class="h-dwn-car">

            <li>
                <div id="circle"></div><a href="car.html"><i class="fa-solid fa-cart-shopping"></i></a>
                <div class="dwn-car"></div>
            </li>
        </ul>
    </header>
    <div class="container">
        <div class="form-container">
            <h2>Sign Up</h2>
            <form>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
                <input type="button" value="Sign Up" id="sign_up">
                <p>Have an account? <a href="login.html">Login</a></p>
            </form>
        </div>
    </div>
    <script src="js/signup.js"></script>
</body>

</html>
